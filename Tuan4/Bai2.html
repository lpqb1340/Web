<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="btnInc">Click</button>
    <span id="countE"></span>
    <script>
        var btnInc = document.getElementById('btnInc')
        var countE = document.getElementById('countE')
        var count = 0
        btnInc.onclick = () => {
            count++
            countE.innerText = count
        }
    </script>
</body>

</html>
