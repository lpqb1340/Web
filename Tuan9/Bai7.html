<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <input type="text" id="inputText" placeholder="Nhập ngày tháng...">
    <button id="addButton">Add</button>

    <script>
        $(document).ready(function() {
            $('#addButton').click(function() {
                var inputText = $('#inputText').val();
                var pattern = /^([0-2][0-9]|3[0-1])\/(0[1-9]|1[0-2])\/([0-9]{4})$/;
                var isValid = pattern.test(inputText);

                if (isValid) {
                    $('body').append('<p>' + inputText + '</p>');
                    $('#inputText').val('');
                } else {
                    alert('Vui lòng chỉ nhập ngày tháng hợp lệ!');
                }
            });
        });
    </script>
</body>

</html>
